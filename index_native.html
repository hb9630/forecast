<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>农产品价格预测</title>
<script src="echarts.min.js"></script>
<style>
  :root { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  body { margin:0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:#0e1420; color:#e6ebf2; }
  :root[data-theme="light"] body { background:#f9f9f7; color:#0b0b0b; }
  .wrap { max-width:1440px; margin:0 auto; padding:16px; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px; }
  h1 { font-size:21px; margin:0; font-weight:700; }
  h1 small { font-size:13px; font-weight:400; opacity:.6; margin-left:6px; }
  #themeBtn { margin-left:auto; border-radius:9px; border:1px solid rgba(128,140,155,.4);
              background:transparent; color:inherit; padding:6px 12px; font-size:13px; cursor:pointer; }
  #cards { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); }
  @media (max-width:480px){ #cards{grid-template-columns:1fr} }
  .mbcard { background:#161d2b; border:1px solid #2a3444; border-radius:14px; padding:14px 16px 10px;
            min-width:0; overflow:hidden; }
  :root[data-theme="light"] .mbcard { background:#fcfcfb; border-color:#dcdad3; }
  .mbhead { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; margin-bottom:2px; }
  .mbhead b { font-size:16.5px; }
  .mbhead .exch { font-size:11.5px; opacity:.6; }
  .mbhead .rt { margin-left:auto; font-size:13px; white-space:nowrap; }
  .mbhead .rt b { font-size:15px; font-variant-numeric:tabular-nums; }
  .mbchart { height:250px; }
  .mbsum { font-size:11.8px; opacity:.85; margin:2px 0 8px; line-height:1.6; }
  /* 表体滚动（照玉米记分牌：sticky 表头+底汇总，卡内框住） */
  .mbscroll { max-height:284px; overflow:auto; border:1px solid rgba(128,140,155,.22);
              border-radius:8px; }
  table { width:100%; font-size:12.3px; white-space:nowrap; font-variant-numeric:tabular-nums;
          border-collapse:separate; border-spacing:0; }
  thead th { position:sticky; top:0; z-index:2; background:#161d2b; color:#8b95a7; font-size:11px;
             text-align:left; box-shadow: inset 0 -2px 0 rgba(128,140,155,.5); }
  :root[data-theme="light"] thead th { background:#fcfcfb; color:#52514e; }
  tfoot td { position:sticky; bottom:0; background:#161d2b; font-weight:700; font-size:11.5px;
             box-shadow: inset 0 2px 0 rgba(128,140,155,.5); }
  :root[data-theme="light"] tfoot td { background:#fcfcfb; }
  th { padding:5px 10px; }
  td { padding:4.5px 10px; border-bottom:1px solid rgba(128,140,155,.14); }
  .r { text-align:right; }
  .up { color:#ef4444; } .dn { color:#22c55e; }
  .dim { opacity:.6; font-size:11px; }
  .empty { display:flex; align-items:center; justify-content:center; height:340px;
           opacity:.5; font-size:14px; }
  footer { text-align:center; font-size:12px; opacity:.5; padding:18px 0 22px; }
  footer a { color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>农产品价格预测<small>玉米 · 大豆 · 豆粕 · 生猪（月度 20 日均价 + 次日收盘，收盘对账）</small></h1>
    <button id="themeBtn">☀️ 浅色</button>
  </header>

  <div id="cards"></div>

  <footer>数据=交易所公开行情与免费公开源 · 玉米 v23+v31 · 其余 v3g ·
    <a href="multi/index.html">完整记分牌↗</a> · 2026-11-10</footer>
</div>

<script>
/* ============ 品种配置（唯一差异点：数据同构、渲染模板唯一） ============ */
const SYMS = {
  C: {name:'玉米', exch:'大商所 C 主连'},
  A: {name:'大豆', exch:'大商所 A 主连·黄大豆1号'},
  M: {name:'豆粕', exch:'大商所 M 主连'},
  L: {name:'生猪', exch:'大商所 LH 主连'},
  W: {name:'小麦', exch:'郑商所 WH 主连', pending:'数据源攻关中（新浪 WH 已断更，走郑商所官方日线拼接）'},
};
const ORDER = ['C','A','M','L','W'];
const charts = {};

const isDark = () => document.documentElement.classList.contains('dark');
const fmt = v => (v == null || isNaN(v)) ? '—' : Math.round(v).toLocaleString();
const D1 = v => v == null ? '—' : v;
async function j(url){ try{ const r = await fetch(`${url}?t=${Date.now()}`); return r.ok ? await r.json() : null; }catch(e){ return null; } }

/* ============ 卡片模板（所有品种同一渲染函数） ============ */
function cardHTML(code, cfg){
  if (cfg.pending) return `<div class="mbcard"><div class="mbhead"><b>${cfg.name}</b>
    <span class="exch">${cfg.exch}</span></div><div class="empty">${cfg.pending}</div></div>`;
  return `<div class="mbcard">
    <div class="mbhead"><b>${cfg.name}</b><span class="exch">${cfg.exch}</span>
      <span class="rt" id="rt_${code}"></span></div>
    <div class="mbchart" id="ch_${code}"></div>
    <div class="mbsum" id="sum_${code}"></div>
    <div class="mbscroll"><table>
      <thead><tr><th>日期</th><th class="r">收盘</th><th class="r">次日预测</th>
        <th class="r">月预测</th><th class="r">80%区间</th><th class="r">月误差%</th></tr></thead>
      <tbody id="tb_${code}"></tbody>
      <tfoot id="tf_${code}"></tfoot></table></div></div>`;
}

function chartOpt(data){
  const BLUE='#4aa3ff', PRED='#2ee6a8', PT='#f59e0b';
  const gridC = isDark() ? 'rgba(128,140,155,.25)' : 'rgba(128,140,155,.35)';
  const txtC = isDark() ? '#94a3b8' : '#475569';
  const rows = data.price || [];
  const dates = rows.map(r=>r.date), closes = rows.map(r=>r.close);
  const trk = data.track || [];
  const last = data.month || {};
  const opt = {
    animation:false,
    grid:{left:54,right:16,top:26,bottom:22},
    tooltip:{trigger:'axis', backgroundColor:isDark()?'#1e293bf2':'#fffffff2', borderColor:'#475569',
             textStyle:{color:isDark()?'#e2e8f0':'#0f172a', fontSize:11.5}},
    xAxis:{type:'category', data:dates, axisLabel:{color:txtC, fontSize:9.5, formatter:v=>v.slice(2,7)}},
    yAxis:{type:'value', scale:true, splitLine:{lineStyle:{color:gridC}},
           axisLabel:{color:txtC, fontSize:9.5}},
    dataZoom:[{type:'inside'}],
    series:[
      {name:'收盘', type:'line', data:closes, symbol:'none',
       lineStyle:{color:BLUE, width:1.3}, z:3},
      {name:'月度预测轨迹', type:'line', data:trk.map(r=>[r.date, r.m_pred]), symbol:'circle',
       symbolSize:3, itemStyle:{color:PRED}, lineStyle:{color:PRED, width:1, type:'dashed'}, z:4},
    ],
  };
  if (last.pred != null){
    opt.series[0].markPoint = {symbol:'circle', symbolSize:8, itemStyle:{color:PT,
      borderColor:isDark()?'#1e293b':'#fff', borderWidth:1.5},
      label:{color:'#fbbf24', fontSize:10.5, position:'top'},
      data:[{coord:[dates[dates.length-1], last.pred], value:last.pred}]};
    if (last.lo80 != null){
      opt.series[0].markLine = {silent:true, symbol:'none',
        lineStyle:{color:PT, type:'dashed', width:1},
        label:{color:'#fbbf24', fontSize:9.5, position:'end'},
        data:[{yAxis:last.lo80, label:{formatter:'80%下 '+last.lo80}},
              {yAxis:last.hi80, label:{formatter:'80%上 '+last.hi80}}]};
    }
  }
  return opt;
}

async function renderCard(code){
  const cfg = SYMS[code];
  const host = document.getElementById('cards');
  let el = document.getElementById('card_'+code);
  if (!el){ el = document.createElement('div'); el.id = 'card_'+code; el.innerHTML = cardHTML(code, cfg); host.appendChild(el); }
  if (cfg.pending) return;
  const [sb, rp20, price, rt] = await Promise.all([
    j(`multi/scoreboard_${code}.json`), j(`multi/replay20_${code}.json`),
    j(`multi/price_${code}.json`), j(`multi/rt_${code}.json`)]);
  // rt 行
  if (rt && rt.last){
    const chg = rt.last - rt.prev_settle, pc = chg/rt.prev_settle*100, up = chg>=0;
    document.getElementById('rt_'+code).innerHTML =
      `<b class="${up?'up':'dn'}">${rt.last}</b> <span class="${up?'up':'dn'}">${up?'+':''}${pc.toFixed(2)}%</span>`;
  }
  const rows = (sb && sb.rows) || [];
  const mrow = [...rows].reverse().find(r=>r.m && r.m.pred!=null) || {};
  const data = {
    price: (price && price.rows) || rows.filter(r=>r.close!=null).map(r=>({date:r.date, close:r.close})),
    track: (rp20 && rp20.rows) || [],
    month: mrow.m || null,
  };
  let chart = charts[code];
  if (!chart){ chart = echarts.init(document.getElementById('ch_'+code)); charts[code] = chart; }
  chart.setOption(chartOpt(data), true);
  // 摘要（数据驱动：live 标志区分实盘/回放来源，模板无分支）
  const tsum = (rp20 && rp20.summary) || {}, ss = (sb && sb.summary) || {};
  const tag = tsum.live ? '实盘' : '回放';
  let sum = `月度（${tag}${tsum.live?'':` 3年·${tsum.n??0}点`}）：MAE <b>${tsum.maeM??'—'}%</b>`;
  if (!tsum.live && tsum.maeNaive!=null) sum += ` vs naive ${tsum.maeNaive}%`;
  if (!tsum.live && tsum.hit!=null) sum += ` · 方向 ${tsum.hit}%`;
  if (!tsum.live && ss.nM) sum += ` · 实盘 ${ss.nM} 笔 ${ss.maeM}%`;
  if (tsum.live && ss.nD) sum += ` · 次日实盘 ${ss.nD} 笔 ${ss.maeD}%`;
  document.getElementById('sum_'+code).innerHTML = sum;
  // 表格（滚动区：全部实盘行，上限 60；底汇总照玉米记分牌）
  document.getElementById('tb_'+code).innerHTML = rows.slice(-60).reverse().map(r=>{
    const m = r.m || {}, d2 = r.d2 || {};
    const e = m.err, ec = e==null ? '' : e>=0 ? 'up' : 'dn';
    const cell = e!=null ? `<span class="${ec}">${e}</span>`
      : (m.prog!=null ? `<span class="dim">进行中 ${m.prog}/20</span>` : '—');
    const d2e = d2.err, d2c = d2e==null ? '' : d2e>=0 ? 'up' : 'dn';
    return `<tr><td>${r.date}</td><td class="r">${D1(r.close)}</td>`+
      `<td class="r">${d2.pred!=null?`<b>${d2.pred}</b>${d2e!=null?` <span class="dim ${d2c}">${d2e}</span>`:''}`:'—'}</td>`+
      `<td class="r">${m.pred!=null?`<b>${m.pred}</b>`:'—'}</td>`+
      `<td class="r dim">${m.lo80!=null?`${m.lo80}–${m.hi80}`:'—'}</td>`+
      `<td class="r">${cell}</td></tr>`;
  }).join('');
  document.getElementById('tf_'+code).innerHTML =
    `<tr><td colspan="3">已兑现平均误差</td>`+
    `<td class="r">${ss.nD?`${ss.nD} 笔 ${ss.maeD}%`:'—'}</td>`+
    `<td class="r">${ss.nM?`${ss.nM} 笔`:'—'}</td>`+
    `<td class="r">${ss.nM?`${ss.maeM}%`:'—'}</td></tr>`;
}

/* ============ 启动 ============ */
(async function init(){
  document.getElementById('themeBtn').onclick = ()=>{
    document.documentElement.classList.toggle('dark');
    document.documentElement.setAttribute('data-theme',
      document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    document.getElementById('themeBtn').textContent = isDark() ? '☀️ 浅色' : '🌙 深色';
    for (const c of ORDER){ if (!SYMS[c].pending) renderCard(c); }
  };
  for (const c of ORDER){ try { await renderCard(c); } catch(e){ console.warn(c, e); } }
  let rz = null;
  window.addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{
    Object.values(charts).forEach(c=>c.resize()); }, 120); });
})();
</script>
</body>
</html>
