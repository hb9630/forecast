<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>多品种价格预测</title>
<script src="../echarts.min.js"></script>
<style>
  :root { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  body { margin:0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:#0e1420; color:#e6ebf2; }
  :root[data-theme="light"] body { background:#f9f9f7; color:#0b0b0b; }
  .card { background:#161d2b; border:1px solid #2a3444; border-radius:12px; }
  :root[data-theme="light"] .card { background:#fcfcfb; border-color:#dcdad3; }
  .wrap { max-width:1400px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  h1 { font-size:20px; margin:0; font-weight:700; }
  h1 small { font-size:13px; font-weight:400; opacity:.6; }
  .tabs { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  .tab { padding:5px 14px; border-radius:8px; border:1px solid rgba(128,140,155,.4);
         background:transparent; color:inherit; cursor:pointer; font-size:14px; }
  .tab.on { background:#3987e5; border-color:#3987e5; color:#fff; }
  .tab:disabled { opacity:.35; cursor:not-allowed; }
  .ranges { display:flex; gap:4px; }
  .rng { padding:2px 10px; font-size:12px; border-radius:6px; border:1px solid rgba(128,140,155,.35);
         background:transparent; color:inherit; cursor:pointer; }
  .rng.on { background:rgba(57,135,229,.25); border-color:#3987e5; }
  #chart { height:400px; padding:6px 4px 0; }
  .rt { display:flex; gap:18px; flex-wrap:wrap; padding:10px 16px 0; font-size:14px; align-items:baseline; }
  .rt b { font-size:20px; font-variant-numeric:tabular-nums; }
  .up { color:#dc2626; } .dn { color:#16a34a; } .mut { opacity:.6; }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:13px;
          font-variant-numeric:tabular-nums; }
  th { position:sticky; top:0; z-index:2; text-align:left; padding:7px 12px; font-size:12px;
       color:#8b95a7; background:#161d2b;
       box-shadow: inset 0 -2px 0 rgba(128,140,155,.55); white-space:nowrap; }
  :root[data-theme="light"] th { color:#52514e; background:#fcfcfb; }
  .r { text-align:right; }
  td { padding:5px 12px; border-bottom:1px solid rgba(128,140,155,.18); white-space:nowrap; }
  #sbWrap { max-height:360px; overflow:auto; }
  .card h3 { margin:0; padding:14px 16px 4px; font-size:15px; }
  .card h3 small { font-weight:400; opacity:.65; font-size:12.5px; }
  #sumline { padding:4px 16px 10px; font-size:12.5px; opacity:.85; line-height:1.7; }
  .pill { font-size:10px; padding:0 6px; border-radius:99px; border:1px solid rgba(128,140,155,.4);
          color:#8b95a7; margin-left:6px; vertical-align:1px; }
  tr.rp td { opacity:.62; }
  footer { text-align:center; font-size:12px; opacity:.5; padding-bottom:20px; }
  @media (max-width:640px){ #chart{height:300px} .rt{gap:12px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>多品种价格预测 <small id="sub">· 豆粕 大商所主连</small></h1>
    <div class="tabs" id="tabs"></div><a class="tab" href="signals.html" style="text-decoration:none">模拟持仓 ↗</a>
  </header>

  <section class="card">
    <div class="rt" id="rt"><span class="mut">加载中…</span></div>
    <div style="display:flex;justify-content:flex-end;padding:0 12px">
      <div class="ranges" id="ranges"></div>
    </div>
    <div id="chart"></div>
  </section>

  <section class="card">
    <h3>预测记分牌 <small>（最新在顶；次日预测=明日收盘、月预测=未来 20 交易日收盘均价，误差由收盘对账。<span class="pill">回</span>=滚动回放，上线日前用当时数据逐日重算，无未来函数）</small></h3>
    <div id="sumline"></div>
    <div id="sbWrap">
      <table>
        <thead><tr>
          <th>日期</th><th>来源</th>
          <th class="r">开盘</th><th class="r">收盘</th>
          <th class="r">次日预测</th><th class="r">次日误差%</th>
          <th class="r">月预测</th><th class="r">80%区间</th><th class="r">进度</th><th class="r">月误差%</th>
        </tr></thead>
        <tbody id="sbBody"></tbody>
      </table>
    </div>
  </section>

  <footer>多品种价格预测 · 数据=交易所公开行情（新浪）· 引擎 v1/v2 + v3g(LGBM) · 实盘自 2026-11-10 · 2026-11-10</footer>
</div>

<script>
const SYMS = {
  C: {name:'玉米', exch:'大商所 C 主连'},
  M: {name:'豆粕', exch:'大商所 M 主连 · 大豆榨油副产品（饲料）'},
  A: {name:'大豆', exch:'大商所 A 主连（黄大豆1号·国产豆）'},
  L: {name:'生猪', exch:'大商所 LH 主连'},
  W: {name:'小麦', exch:'郑商所 WH · 数据源攻关中', disabled:true},
};
let cur = 'C', RNG = '3Y';
const chart = echarts.init(document.getElementById('chart'), null, {renderer:'canvas'});
const $ = id => document.getElementById(id);
const D = (x, d=1) => x==null ? '—' : (+x).toFixed(d);

async function j(url){ try { return await (await fetch(`${url}?v=${Date.now()}`)).json(); } catch(e){ return null; } }

async function load(code){
  cur = code;
  $('sub').textContent = '· ' + SYMS[code].name + ' ' + SYMS[code].exch;
  const [sb, rp, rp20, price, rt] = await Promise.all([
    j(`scoreboard_${code}.json`), j(`replay_${code}.json`), j(`replay20_${code}.json`),
    j(`price_${code}.json`), j(`rt_${code}.json`)]);
  renderRt(rt);
  renderChart(sb, rp, rp20, price);
  renderTable(sb, rp, rp20);
}

function renderRt(rt){
  const el = $('rt');
  if (!rt){ el.innerHTML = '<span class="mut">实时快照未生成（收盘拍后可用）</span>'; return; }
  const chg = rt.last - rt.prev_settle, p = chg/rt.prev_settle*100;
  const cls = chg >= 0 ? 'up' : 'dn';
  el.innerHTML =
    `<span>${rt.name} 现价 <b class="${cls}">${rt.last}</b>
       <span class="${cls}">${chg>=0?'+':''}${D(chg)} (${chg>=0?'+':''}${D(p,2)}%)</span></span>
     <span class="mut">昨结 ${rt.prev_settle} · 开 ${rt.open} · 快照 ${new Date(rt.ts*1000).toLocaleString('zh-CN')}</span>`;
}

const RANGE_DAYS = {'6M':126, '1Y':252, '3Y':750, 'ALL':1e9};

function renderChart(sb, rp, rp20, price){
  const prows = (price && price.rows) || sb.rows.filter(r=>r.close!=null).map(r=>({date:r.date,close:r.close}));
  const k = Math.max(0, prows.length - RANGE_DAYS[RNG]);
  const view = prows.slice(k);
  const dates = view.map(r=>r.date);
  const closes = view.map(r=>r.close);
  const inView = new Set(dates);
  // 次日预测点：回放（淡）+实盘（实）
  const rpPts = (rp && rp.rows || []).filter(r=>inView.has(r.date))
    .map(r=>[r.date, r.d2_pred]);
  const live = {}; (sb.rows||[]).forEach(r=>{ if(r.d2 && r.d2.pred!=null) live[r.date]=r.d2.pred; });
  const livePts = Object.entries(live).filter(d=>inView.has(d[0])).map(d=>[d[0],d[1]]);
  const m20 = (rp20 && rp20.rows || []).filter(r=>inView.has(r.date));
  const last = (sb.rows||[]).filter(r=>r.m && r.m.pred!=null).pop();
  const series = [
    { name:'收盘价', type:'line', data:closes, showSymbol:false,
      lineStyle:{width:2, color:'#3987e5'}, itemStyle:{color:'#3987e5'}, z:3 },
    { name:'月预测(20日均)', type:'line', data:m20.map(r=>[r.date, r.m_pred]), symbol:'circle',
      symbolSize:5, itemStyle:{color:'#199e70'}, lineStyle:{width:1, type:'dashed', color:'#199e70'}, z:4 },
    { name:'次日预测(回放)', type:'scatter', data:rpPts, symbolSize:3,
      itemStyle:{color:'#d95926', opacity:.4}, z:2 },
    { name:'次日预测(实盘)', type:'scatter', data:livePts, symbolSize:7,
      itemStyle:{color:'#d95926', borderColor:'#0e1420', borderWidth:1}, z:5 },
  ];
  if (last && last.m && last.m.pred!=null){
    series[1].data.push([dates[dates.length-1], last.m.pred]);
  }
  const opt = {
    backgroundColor:'transparent',
    grid:{left:56,right:16,top:30,bottom:28},
    legend:{top:2, textStyle:{color:'#8b95a7', fontSize:11}, itemWidth:14, itemHeight:8},
    tooltip:{trigger:'axis', backgroundColor:'#161d2b', borderColor:'#2a3444',
             textStyle:{color:'#e6ebf2', fontSize:12}},
    xAxis:{type:'category', data:dates, axisLine:{lineStyle:{color:'rgba(128,140,155,.4)'}},
           axisLabel:{color:'#8b95a7', fontSize:11}},
    yAxis:{type:'value', scale:true, splitLine:{lineStyle:{color:'rgba(128,140,155,.15)'}},
           axisLabel:{color:'#8b95a7', fontSize:11}},
    series,
  };
  chart.setOption(opt, true);
}

function renderTable(sb, rp, rp20){
  const live = {}; (sb.rows||[]).forEach(r=>live[r.date]=r);
  const rpBy = {}; (rp && rp.rows || []).forEach(r=>rpBy[r.date]=r);
  const m20 = {}; (rp20 && rp20.rows || []).forEach(r=>m20[r.date]=r);
  const all = [...new Set([...Object.keys(live), ...Object.keys(rpBy)])].sort().reverse();
  const body = all.map(d=>{
    const L = live[d], R = rpBy[d], isRp = !L && !!R;
    const d2 = L && L.d2 || {};
    const m = (L && L.m) || {};
    const d2e = d2.err!=null ? d2.err : (R ? R.d2_err : null);
    const d2c = d2e==null ? '' : (+d2e)>=0 ? 'up' : 'dn';
    const me = m.err!=null ? m.err : null;
    const mc = me==null ? '' : (+me)>=0 ? 'up' : 'dn';
    const band = m.lo80!=null ? `${m.lo80}~${m.hi80}` : '';
    const prog = m.prog!=null ? m.prog+'/20' : '';
    return `<tr${isRp?' class="rp"':''}>
      <td>${d}${isRp?'<span class="pill">回</span>':''}</td>
      <td>${isRp?'回放':'实盘'}</td>
      <td class="r">${L && L.open!=null ? L.open : '—'}</td>
      <td class="r">${L && L.close!=null ? L.close : (R ? R.d2_act : '—')}</td>
      <td class="r">${d2.pred!=null ? d2.pred : (R ? R.d2_pred : '—')}</td>
      <td class="r ${d2c}">${d2e!=null ? d2e : '—'}</td>
      <td class="r">${m.pred!=null ? m.pred : '—'}</td>
      <td class="r" style="opacity:.75">${band||'—'}</td>
      <td class="r" style="opacity:.75">${prog||'—'}</td>
      <td class="r ${mc}">${me!=null ? me : '—'}</td></tr>`;
  }).join('');
  $('sbBody').innerHTML = body || '<tr><td colspan="10" class="mut">暂无数据</td></tr>';
  const s = (sb && sb.summary) || {};
  let html = `实盘：次日 n=${s.nD??0}，MAE=${s.maeD??'—'}% · 月度 n=${s.nM??0}，MAE=${s.maeM??'—'}%`;
  if (rp && rp.summary){
    const rs = rp.summary;
    html += `<br>日度回放 ${rs.n} 日：v2 MAE ${rs.maeV2}% vs v1 ${rs.maeV1}% vs naive ${rs.maeNaive}%`;
  }
  if (rp20 && rp20.summary && rp20.summary.n){
    const ms = rp20.summary;
    html += ms.live ? ` · 月度实盘 ${ms.n} 笔：MAE ${ms.maeM}%`
                    : ` · 月度回放 ${ms.n} 点：v3g MAE ${ms.maeM}% vs naive ${ms.maeNaive}%`;
  }
  html += ` · 生成 ${new Date((sb.generated_epoch||0)*1000).toLocaleString('zh-CN')}`;
  $('sumline').innerHTML = html;
}

// tabs & ranges
const tabsEl = $('tabs');
for (const [code,cfg] of Object.entries(SYMS)){
  const b = document.createElement('button');
  b.className = 'tab'; b.textContent = cfg.name; b.dataset.code = code;
  if (cfg.disabled){ b.disabled = true; b.title = cfg.exch; }
  else b.onclick = ()=>{ location.hash = code; };
  tabsEl.appendChild(b);
}
const rngEl = $('ranges');
for (const r of ['6M','1Y','3Y','ALL']){
  const b = document.createElement('button');
  b.className = 'rng' + (r===RNG?' on':''); b.textContent = r==='3Y' ? '3年' : r;
  b.onclick = ()=>{ RNG = r; rngEl.querySelectorAll('.rng').forEach(x=>x.classList.toggle('on',x===b)); refresh(); };
  rngEl.appendChild(b);
}
function syncTabs(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.code===cur));
}
async function refresh(){ await load(cur); syncTabs(); }
window.addEventListener('hashchange', ()=>{
  const c = location.hash.slice(1);
  if (SYMS[c] && !SYMS[c].disabled){ load(c).then(syncTabs); }
});
const init = location.hash.slice(1);
if (SYMS[init] && !SYMS[init].disabled) cur = init;
load(cur).then(syncTabs);
window.addEventListener('resize', ()=>chart.resize());
</script>
</body>
</html>
